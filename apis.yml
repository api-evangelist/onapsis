aid: onapsis
name: Onapsis
description: 'Onapsis is a cybersecurity and compliance company for business-critical
  applications — SAP, Oracle and Salesforce — headquartered in Boston with offices
  in Buenos Aires and Heidelberg. The Onapsis Platform delivers vulnerability management
  (Assess), threat detection and response (Defend), secure SAP development and transport
  control (Control), continuous compliance (Comply) and an AI-driven Security Advisor,
  backed by the threat intelligence produced by Onapsis Research Labs. The platform
  exposes a GraphQL-based public API for third-party integrations, custom reporting
  and workflow automation, authenticated with a UI-generated API key exchanged for
  a bearer token; the API is served from each customer''s own Onapsis console rather
  than from a shared multi-tenant host, and the API reference is published inside the
  customer portal. Onapsis previewed an MCP Gateway for SAP Security in March 2026
  to let corporate-sanctioned AI agents invoke platform capabilities and Research Labs
  threat intelligence.'
